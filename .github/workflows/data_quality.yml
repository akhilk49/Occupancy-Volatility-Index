name: Data Quality

on:
  push:
    paths:
      - "src/**"
      - "sql/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "src/**"
      - "sql/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  data-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data quality tests
        run: pytest tests/ -v --tb=short

      # Note: tests that require data files (raw CSVs, occupancy.db) skip
      # automatically when those files are absent. The CI gate enforces
      # schema-level and code-level correctness on every push.
      # Full pipeline tests (with real data) are run locally before merging.
